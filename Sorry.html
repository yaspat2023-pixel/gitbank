<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitBank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 844px;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        @media(min-width: 401px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #1f293d;
                height: 90vh;
            }
        }

        /* Header */
        .header {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
        }

        .username {
            font-size: 16px;
            font-weight: 600;
        }

        .user-tag {
            font-size: 12px;
            color: #9ca3af;
        }

        .icon-btn {
            background: #1f293d;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card */
        .card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #64748b;
        }

        /* Actions */
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action-btn {
            background: #1f293d;
            border: none;
            border-radius: 16px;
            padding: 15px 10px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
            background: #374151;
        }

        .action-icon {
            width: 36px;
            height: 36px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        /* Section */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            color: #e2e8f0;
        }

        /* Navigation Bar */
        .nav-bar {
            background: #111827;
            border-top: 1px solid #1f293d;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item {
            background: none;
            border: none;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .nav-item.active, .nav-item:active {
            color: #3b82f6;
        }

        /* Modals */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 100;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            width: 85%;
            max-width: 320px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #3b82f6;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-btn.cancel {
            background: #334155;
            color: #fff;
        }

        .modal-btn.submit {
            background: #3b82f6;
            color: #fff;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        /* Bots List */
        .bots-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .bot-item {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .bot-item:hover, .bot-item.selected {
            border-color: #3b82f6;
            background: #162032;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bot-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .bot-name {
            font-size: 14px;
            font-weight: 600;
        }

        .bot-desc {
            font-size: 11px;
            color: #9ca3af;
        }

        /* Toast notification */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #3b82f6;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Secret / Hidden Admin trigger zone */
        .secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Toast message -->
        <div id="toast" class="toast">Повідомлення</div>

        <!-- Header -->
        <div class="header">
            <div class="profile-info" onclick="openProfileModal()">
                <div class="avatar" id="avatarLetter">U</div>
                <div>
                    <div class="username" id="displayUsername">Користувач</div>
                    <div class="user-tag">GitBank Client</div>
                </div>
            </div>
            <button class="icon-btn" onclick="triggerSettingsClick()">⚙️</button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Card -->
            <div class="card">
                <div class="card-title">Основний рахунок</div>
                <div class="balance" id="balanceText">0 ₴</div>
                <div class="card-footer">
                    <span>**** 4026</span>
                    <span>GitBank UA</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="action-btn" onclick="onDepositClick()">
                    <div class="action-icon">➕</div>
                    Поповнити
                </button>
                <button class="action-btn" onclick="openTransferModal()">
                    <div class="action-icon">↗️</div>
                    Переказати
                </button>
                <button class="action-btn" onclick="showToast('Всі послуги активні')">
                    <div class="action-icon">📊</div>
                    Аналіз
                </button>
            </div>

            <div class="section-title">Швидкі послуги</div>
            <div style="background: #162032; padding: 16px; border-radius: 16px; font-size: 13px; color: #9ca3af; text-align: center; border: 1px solid rgba(255,255,255,0.05);">
                Безпечне з'єднання через Git Protocol активне.
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-item active">
                <span>🏠</span> Головна
            </button>
            <button class="nav-item" onclick="openTransferModal()">
                <span>💳</span> Перекази
            </button>
            <button class="nav-item" onclick="triggerSettingsClick()">
                <span>⚙️</span> Налаштування
            </button>
        </div>

        <!-- Secret Trigger Bottom Right -->
        <div class="secret-trigger" onclick="openAdminModal()"></div>
    </div>

    <!-- Modal: Profile (Change Nickname) -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div class="modal-title">Змінити нікнейм</div>
            <input type="text" id="nicknameInput" class="modal-input" placeholder="Введіть новий нік">
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModals()">Скасувати</button>
                <button class="modal-btn submit" onclick="saveNickname()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Modal: Transfer to Bots -->
    <div class="modal" id="transferModal">
        <div class="modal-content" style="max-width: 350px;">
            <div class="modal-title">Переказ користувачу</div>
            <div class="bots-list" id="botsList">
                <!-- Injected via JS -->
            </div>
            <input type="number" id="transferAmount" class="modal-input" placeholder="Сума (₴)">
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModals()">Скасувати</button>
                <button class="modal-btn submit" onclick="executeTransfer()">Надіслати</button>
            </div>
        </div>
    </div>

    <!-- Modal: Admin Panel -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="border-color: #ef4444;">
            <div class="modal-title" style="color: #ef4444;">🛠️ Адмін-панель</div>
            <div style="font-size: 12px; color: #9ca3af; text-align: center;">Редагування балансу GitBank</div>
            <input type="number" id="adminBalanceInput" class="modal-input" placeholder="Новий баланс">
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModals()">Закрити</button>
                <button class="modal-btn submit" style="background: #ef4444;" onclick="saveAdminBalance()">Встановити</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 0;
        let username = "Користувач";
        let settingsClicks = 0;
        let selectedBot = null;

        const bots = [
            { id: 1, name: "Олександр (Бот)", desc: "Користувач GitBank", avatar: "👨‍💻" },
            { id: 2, name: "Софія (Бот)", desc: "Розробник UI/UX", avatar: "👩‍🎨" },
            { id: 3, name: "Максим (Бот)", desc: "Тимлід проєкту", avatar: "🤖" },
            { id: 4, name: "Анна (Бот)", desc: "Тестувальник додатку", avatar: "👩‍💻" }
        ];

        // Web Audio API Sound generator (Clicks & iPhone Apple Pay sound)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // Apple Pay / iPhone payment success chime
        function playIphonePaySound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            
            // First note (G5)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(783.99, now); // G5
            
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            // Second note (C6) - higher chime tone
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1046.50, now + 0.1); // C6
            
            gain2.gain.setValueAtTime(0.2, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.4);
        }

        // Add sound to all clicks automatically
        document.addEventListener('click', () => {
            playClickSound();
        });

        function updateUI() {
            document.getElementById("balanceText").innerText = balance + " ₴";
            document.getElementById("displayUsername").innerText = username;
            document.getElementById("avatarLetter").innerText = username.charAt(0).toUpperCase();
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.innerText = text;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function onDepositClick() {
            showToast("Ви ще незабагато літні!");
        }

        // Profile Modal
        function openProfileModal() {
            document.getElementById("nicknameInput").value = username;
            document.getElementById("profileModal").classList.add("open");
        }

        function saveNickname() {
            const val = document.getElementById("nicknameInput").value.trim();
            if (val) {
                username = val;
                updateUI();
                showToast("Нікнейм змінено!");
            }
            closeModals();
        }

        // Transfer Modal
        function openTransferModal() {
            renderBots();
            document.getElementById("transferAmount").value = "";
            document.getElementById("transferModal").classList.add("open");
        }

        function renderBots() {
            const list = document.getElementById("botsList");
            list.innerHTML = "";
            bots.forEach(bot => {
                const isSelected = selectedBot && selectedBot.id === bot.id;
                list.innerHTML += `
                    <div class="bot-item ${isSelected ? 'selected' : ''}" onclick="selectBot(${bot.id})">
                        <div class="bot-info">
                            <div class="bot-avatar">${bot.avatar}</div>
                            <div>
                                <div class="bot-name">${bot.name}</div>
                                <div class="bot-desc">${bot.desc}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function selectBot(id) {
            selectedBot = bots.find(b => b.id === id);
            renderBots();
        }

        function executeTransfer() {
            const amount = parseInt(document.getElementById("transferAmount").value);
            if (!selectedBot) {
                showToast("Оберіть отримувача!");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showToast("Введіть коректну суму!");
                return;
            }
            if (amount > balance) {
                showToast("Недостатньо коштів на рахунку!");
                return;
            }

            balance -= amount;
            updateUI();
            closeModals();
            
            // Play iPhone payment success sound!
            playIphonePaySound();
            
            showToast(`Успішно переказано ${amount} ₴ для ${selectedBot.name}`);
            selectedBot = null;
        }

        // Settings 10 clicks Easter egg
        function triggerSettingsClick() {
            settingsClicks++;
            if (settingsClicks >= 10) {
                settingsClicks = 0;
                openAdminModal();
            } else {
                showToast(`Налаштування (${settingsClicks}/10)`);
            }
        }

        // Admin Panel
        function openAdminModal() {
            document.getElementById("adminBalanceInput").value = balance;
            document.getElementById("adminModal").classList.add("open");
        }

        function saveAdminBalance() {
            const val = parseInt(document.getElementById("adminBalanceInput").value);
            if (!isNaN(val)) {
                balance = val;
                updateUI();
                showToast("Баланс оновлено через Адмін-панель!");
            }
            closeModals();
        }

        function closeModals() {
            document.querySelectorAll(".modal").forEach(m => m.classList.remove("open"));
        }

        updateUI();
    </script>
</body>
</html>
